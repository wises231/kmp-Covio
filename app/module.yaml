product:
  type: jvm/lib

dependencies:
  # Amper 的模块依赖不传递。引擎、模型与 Ports 都在 kmpDomain 里，所以要显式声明。
  - ../kmpDomain
  # P6 之后本模块不再是 macOS 宿主，只保留可复用的界面件与 helper 协议。
  # Compose 只被 MacTheme、MacComponents 与 CovioTrayIcon 用到。
  - $compose.desktop.currentOs
  # JNA 只有 HelperServer 用：Unix 域套接字的 socket/bind/accept/read/write/getpeereid。
  # 原来的另一个用途 libCovioDrag.dylib 已随 P6 删除，能力在 Swift 侧重写。
  - $libs.jna
  - $libs.kotlinx.coroutines.core
  - $libs.kotlinx.serialization.json

settings:
  compose:
    enabled: true
  kotlin:
    serialization: json
