name: Optimization
description: 性能或资源改进。有一个可测量的基线数字。
title: "[Optimization] "
labels: ["area/perf"]
type: Optimization
body:
  - type: markdown
    attributes:
      value: |
        写不出基线数字的，走 Problem。
        关闭条件是证据表里有前后数值对比。
  - type: input
    id: baseline
    attributes:
      label: 当前基线
      description: 一个数。写清测量方法和环境。
      placeholder: 冷启动 840 毫秒，macOS 27.0.1，M2 MacBook Air
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: 目标
      description: 一个数。
      placeholder: 冷启动 500 毫秒以内
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: 验证方法
      description: 怎么测。测几次。在哪个环境测。
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: 手段
      description: 编号列表。一步一件事。
    validations:
      required: false
  - type: input
    id: evidence
    attributes:
      label: 证据放哪
      description: 前后对比数据写到哪个文件，或者写「issue 评论」。
      placeholder: docs/research/<topic>/evidence.md
    validations:
      required: true
