name: Feature
description: 大功能。需要拆成 sub-issue 交付。
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        判断大功能：需要 2 个以上 PR；预计超过 5 个工作日；需要先改设计。满足任一条就用本表单。
        标题写成「动词 对象」，例如「Add the workbench store」。
        拆法与回链格式见 [研发工作流](../../doc/process/workflow.md) 的 S6 与 S7。
        界面变化的功能先走 S5，出 web 的 Compose 预览，评审通过再实施。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 交付后用户能做什么。不写实现细节。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 表现预期
      description: 界面变化时必填。逐条写出界面要满足的表现，评审人拿它对照预览。
      placeholder: |
        - <用户看到什么>
        - <什么条件下变成什么样>
    validations:
      required: false

  - type: input
    id: decision
    attributes:
      label: 决策指向
      description: 填写决策编号，例如 `ADR-0007`。没有长期决策时填 `none`。
      placeholder: "decision: pending"
    validations:
      required: true

  - type: input
    id: research
    attributes:
      label: 调研指向
      description: 有调研时填 `research` 加 `#N`。没有就留空。
      placeholder: 'research: #98'
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2]
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: 由负责人打分。取值与 Project 的 `Size` 字段一致。
      options: [XS, S, M, L, XL]
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        建好之后在 Project 里补 Start date 与 Target date。这两个字段只在 Project 维护，不写进正文。

  - type: textarea
    id: subissues
    attributes:
      label: Sub-issue
      description: |
        一行一个。写明验收标准，工期 1 到 3 天。
        用 blocked by 记录顺序。层数不超过 3 层，从本 issue 数起。
      value: |
        - [ ] <子任务> — 验收：<> — 工期：<1 到 3 天>
    validations:
      required: true
