name: Plan
description: 阶段划分、顺序和依赖。不产出可运行代码。
title: "[Plan] "
labels: ["documentation"]
type: Plan
body:
  - type: markdown
    attributes:
      value: |
        计划类 issue 的产物是阶段表和判据。
        计划要有回滚方案。
  - type: textarea
    id: scope
    attributes:
      label: 计划覆盖什么
      description: 范围和边界。一句话写清。
    validations:
      required: true
  - type: textarea
    id: phases
    attributes:
      label: 阶段划分
      description: 每个阶段写内容、顺序和完成判据。
      placeholder: |
        | 阶段 | 内容 | 完成判据 |
        | --- | --- | --- |
        | P0 | ... | ... |
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: 产物路径
      description: 计划写到哪个文件。
      placeholder: docs/roadmap/curtain-workbench.md
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: 前置 issue 或外部条件。没有就写「无」。
    validations:
      required: false
  - type: textarea
    id: rollback
    attributes:
      label: 回滚
      description: 阶段失败时怎么退回去。
    validations:
      required: true
