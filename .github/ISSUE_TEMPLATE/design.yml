name: Design
description: 写代码之前要定下的取舍。产出 ADR 或研究结论。
title: "[Design] "
labels: ["documentation"]
type: Design
body:
  - type: markdown
    attributes:
      value: |
        设计类 issue 的产物是决策，不是代码。
        没有两条以上候选方案的，不是设计类 issue。
  - type: textarea
    id: decide
    attributes:
      label: 要定下什么
      description: 一句话写清要做的决策。为什么现在要定。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 候选方案
      description: 至少两条。每条写做法、代价和适用条件。
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 判定依据
      description: 用什么标准选。标准要可验证。
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: 产物路径
      description: 决策写到哪个文件。
      placeholder: docs/adr/ADR-002-workbench-config-storage.md
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 决策约束了哪些后续工作。哪些 issue 因此改写或关闭。
    validations:
      required: false
